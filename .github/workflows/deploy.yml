
name: Deploy Visitors Register to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          script: |
            cd ~/visitors-register
            git pull origin main
            docker build -t visitors-register .
            docker stop visitors-register || true
            docker rm visitors-register || true
            docker run -d \
              --name visitors-register \
              --restart unless-stopped \
              -p 80:80 \
              visitors-register
